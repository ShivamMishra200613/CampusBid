services:
  mongo:
    image: mongo:7.0
    container_name: campusbid_mongo
    restart: unless-stopped
    expose:
      - '27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campusbid_server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/campusbid
      - JWT_SECRET=campusbid_secure_docker_jwt_secret_key_2026
      - JWT_EXPIRES_IN=7d
      - CLIENT_ORIGIN=http://localhost:8080
      - AUCTION_SWEEP_MS=10000
      - ADMIN_EMAIL=admin@ves.ac.in
      - ADMIN_PASSWORD=AdminPassword123!
    ports:
      - '5000:5000'
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: campusbid_client
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - server

volumes:
  mongo_data:
  uploads_data:
