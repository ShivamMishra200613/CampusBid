name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Client - Install, Lint & Build
        run: |
          cd client
          npm ci
          npm run lint
          npm run build

      - name: Server - Install & Run Tests
        env:
          NODE_ENV: test
          PORT: 5001
          MONGO_URI: mongodb://127.0.0.1:27017/campusbid_test
          MONGO_URI_TEST: mongodb://127.0.0.1:27017/campusbid_test
          JWT_SECRET: ci-test-secret-key-32-chars-long-abc
          JWT_EXPIRES_IN: 1h
          CLIENT_ORIGIN: http://localhost:5173
          ADMIN_EMAIL: admin@ves.ac.in
          ADMIN_PASSWORD: AdminPassword123!
          AUCTION_SWEEP_MS: 10000
        run: |
          cd server
          npm ci
          npm test

      - name: Install Playwright Browsers
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package.json ]; then
            npm ci --ignore-scripts || true
            npx playwright install --with-deps chromium || true
            npm run e2e || true
          fi

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
